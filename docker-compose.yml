services:
  nexus-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-hermetic-node:latest
    container_name: nexus_oracle_node
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - TRADING_MODE=PAPER_ONLY
    volumes:
      # Mount host data directory for persistent SQLite WAL ledger
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
